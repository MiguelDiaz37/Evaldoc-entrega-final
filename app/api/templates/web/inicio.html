{% extends "web/base.html" %}
{% set seccion = 'docentes' %}
{% block titulo %}Docentes{% endblock %}
{% block contenido %}
<div class="contenedor">
  <section class="portada">
    <h1>Conoce a tus docentes.</h1>
    <p>Opiniones y calificaciones de otros estudiantes de la UMB.</p>
  </section>

  <form class="tarjeta buscador" role="search" action="/" method="get"
        hx-get="/" hx-target="#resultados" hx-push-url="true" hx-indicator="#cargando"
        hx-trigger="input changed delay:300ms from:#q, change from:select, submit">
    <div class="completo">
      <label class="etiqueta" for="q">Buscar docente</label>
      <div class="con-icono">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6474" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" name="q" class="campo" type="search" value="{{ q }}" autocomplete="off"
               placeholder="Escribe un nombre, por ejemplo: julian">
      </div>
    </div>
    <div>
      <label class="etiqueta" for="facultad">Facultad</label>
      <select id="facultad" name="facultad" class="campo">
        <option value="">Todas</option>
        {% for f in facultades %}
        <option value="{{ f.id_facultad }}" {{ 'selected' if f.id_facultad == facultad }}>{{ f.nombre }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="etiqueta" for="materia">Materia</label>
      <select id="materia" name="materia" class="campo">
        <option value="">Todas las materias</option>
        {% for m in materias %}
        <option value="{{ m.id_materia }}" {{ 'selected' if m.id_materia == materia }}>{{ m.nombre }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="etiqueta" for="orden">Ordenar por</label>
      <select id="orden" name="orden" class="campo">
        <option value="mejor" {{ 'selected' if orden == 'mejor' }}>Mejor calificados</option>
        <option value="peor" {{ 'selected' if orden == 'peor' }}>Peor calificados</option>
        <option value="nombre" {{ 'selected' if orden == 'nombre' }}>Nombre (A–Z)</option>
      </select>
    </div>
    <div class="acciones">
      <a class="boton boton-secundario" href="/">Limpiar filtros</a>
    </div>
    <noscript><button class="boton boton-primario" type="submit">Buscar</button></noscript>
  </form>

  <div id="resultados" aria-live="polite">
    {% include "web/_resultados.html" %}
  </div>
</div>
{% endblock %}
